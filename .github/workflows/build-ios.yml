name: Build tvbox-Swift iOS IPA
on:
  workflow_dispatch: # 网页手动点按钮触发编译（推荐）
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: 缓存Swift Package依赖，减少重复下载耗时
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ github.sha }}

      - name: Xcode Clean清理旧构建产物
        run: |
          xcodebuild clean \
          -project tvbox-Swift.xcodeproj \
          -scheme tvbox-Swift \
          -destination generic/platform=iOS

      - name: Archive归档，注入Bundle ID（解决Archive Missing Bundle Identifier报错）
        run: |
          xcodebuild archive \
          -project tvbox-Swift.xcodeproj \
          -scheme tvbox-Swift \
          -destination generic/platform=iOS \
          -archivePath tvboxSwift.xcarchive \
          PRODUCT_BUNDLE_IDENTIFIER=com.test.tvboxswift \
          SKIP_INSTALL=NO \
          BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: 导出【未签名IPA】
        run: |
          xcodebuild -exportArchive \
          -archivePath tvboxSwift.xcarchive \
          -exportPath ./output \
          -exportOptionsPlist <(echo '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string></string>
            <key>provisioningProfile</key>
            <string></string>
            <key>bundleIdentifier</key>
            <string>com.test.tvboxswift</string>
          </dict>
          </plist>')

      - name: 上传IPA成品，打包完成下载
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-swift-ipa
          path: ./output/*.ipa
          retention-days: 7
