name: Build tvbox-Swift iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 【调试】打印根目录
        run: ls -la

      - name: 进入 tvbox-Swift 子目录
        run: cd tvbox-Swift

      - name: 【调试】打印子目录内容（确认项目文件）
        run: ls -la tvbox-Swift

      - name: 配置Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: 查看可用Scheme
        run: xcodebuild -list -project tvbox-Swift/tvbox-Swift.xcodeproj

      - name: Clean清理
        run: xcodebuild clean -project tvbox-Swift/tvbox-Swift.xcodeproj -scheme tvbox-Swift -destination generic/platform=iOS

      - name: Archive归档
        run: |
          xcodebuild archive \
          -project tvbox-Swift/tvbox-Swift.xcodeproj \
          -scheme tvbox-Swift \
          -destination generic/platform=iOS \
          -archivePath tvboxSwift.xcarchive \
          SKIP_INSTALL=NO

      - name: 导出未签名IPA
        run: |
          xcodebuild -exportArchive \
          -archivePath tvboxSwift.xcarchive \
          -exportPath ./output \
          -exportOptionsPlist <(echo '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>')

      - name: 上传IPA
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-swift-ipa
          path: ./output/*.ipa
          retention-days: 7
