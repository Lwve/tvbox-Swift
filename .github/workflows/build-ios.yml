name: Build tvbox-Swift iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Xcode & iOS SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iOS

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ github.sha }}

      - name: Xcode Clean
        run: |
          xcodebuild clean -project tvbox.xcodeproj -scheme tvbox \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive
        run: |
          xcodebuild archive -project tvbox.xcodeproj -scheme tvbox \
            -destination generic/platform=iOS \
            -archivePath tvboxSwift.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER=com.test.tvboxswift \
            SKIP_INSTALL=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # ========= 删除原来 Generate exportOptions.plist 和 Export IPA 两个步骤 =========
      # 手动提取App，打包IPA，完全绕开exportArchive
      - name: Manual build IPA (Payload zip)
        run: |
          # 创建Payload文件夹（iOS IPA标准结构）
          mkdir -p ./output/Payload
          # 把编译好的app复制进Payload
          cp -r tvboxSwift.xcarchive/Products/Applications/*.app ./output/Payload/
          cd ./output
          # zip打包，生成ipa
          zip -r tvbox-swift.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-swift-ipa
          path: ./output/*.ipa
          retention-days: 7
