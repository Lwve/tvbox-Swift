name: Build tvbox-Swift iOS IPA

on:

workflow_dispatch:

push:

branches: [ main ]



jobs:

build:

runs-on: macos-14

timeout-minutes: 30

steps:

- name: 拉取源码

uses: actions/checkout@v4



- name: 配置Xcode 15.4

uses: maxim-lobanov/setup-xcode@v1

with:

xcode-version: '15.4'



- name: 缓存Swift Package依赖

uses: actions/cache@v4

with:

path: ~/Library/Developer/Xcode/DerivedData

key: ${{ runner.os }}-spm-${{ github.sha }}



- name: Xcode Clean清理

run: |

xcodebuild clean \

-project tvbox-Swift.xcodeproj \

-scheme tvbox-Swift \

-destination generic/platform=iOS



- name: Archive归档，注入Bundle ID

run: |

xcodebuild archive \

-project tvbox-Swift.xcodeproj \

-scheme tvbox-Swift \

-destination generic/platform=iOS \

-archivePath tvboxSwift.xcarchive \

PRODUCT_BUNDLE_IDENTIFIER=com.test.tvboxswift \

SKIP_INSTALL=NO \

BUILD_LIBRARY_FOR_DISTRIBUTION=YES



- name: 生成exportOptions.plist

run: |

cat > exportOptions.plist <<EOF

<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

<plist version="1.0">

<dict>

<key>method</key>

<string>development</string>

<key>signingStyle</key>

<string>manual</string>

<key>signingCertificate</key>

<string></string>

<key>provisioningProfile</key>

<string></string>

<key>bundleIdentifier</key>

<string>com.test.tvboxswift</string>

</dict>

</plist>

EOF



- name: 导出未签名IPA

run: |

xcodebuild -exportArchive \

-archivePath tvboxSwift.xcarchive \

-exportPath ./output \

-exportOptionsPlist exportOptions.plist



- name: 上传IPA成品

uses: actions/upload-artifact@v4

with:

name: tvbox-swift-ipa

path: ./output/*.ipa

retention-days: 7
