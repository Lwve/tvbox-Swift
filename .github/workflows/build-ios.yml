name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up XcodeGen
      run: brew install xcodegen
    
    - name: Load secrets
      run: |
        mkdir -p IOS-key
        echo "${{ secrets.IOS_SECRETS }}" > IOS-key/secrets.sh
        echo "${{ secrets.CERT_P12 }}" | base64 -d > IOS-key/cert.p12
        echo "${{ secrets.CERT_MOBILEPROVISION }}" | base64 -d > IOS-key/cert.mobileprovision
    
    - name: Run package script
      run: |
        chmod +x package_ios.sh
        ./package_ios.sh
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: TVBox.ipa
        path: TVBox.ipa
