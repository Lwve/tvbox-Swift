
name: Build tvbox-Swift iOS IPA
# 两种触发方式：推送代码自动打包；或者手动点击按钮打包（推荐手动）
on:
  workflow_dispatch: # 手动触发，网页点按钮启动编译
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14 # 云macOS虚拟机
    timeout-minutes: 30
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置Xcode环境
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: 缓存Swift Package依赖，减少重复下载
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ github.sha }}

      - name: Xcode Clean清理
        run: xcodebuild clean -project tvbox-Swift.xcodeproj -scheme tvbox-Swift -destination generic/platform=iOS

      - name: Archive归档（编译生成xcarchive）
        run: |
          xcodebuild archive \
          -project tvbox-Swift.xcodeproj \
          -scheme tvbox-Swift \
          -destination generic/platform=iOS \
          -archivePath tvboxSwift.xcarchive \
          SKIP_INSTALL=NO \
          BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: 导出未签名IPA
        run: |
          xcodebuild -exportArchive \
          -archivePath tvboxSwift.xcarchive \
          -exportPath ./output \
          -exportOptionsPlist <(echo '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string></string>
            <key>provisioningProfile</key>
            <string></string>
          </dict>
          </plist>')

      - name: 上传IPA成品，打包完可以下载
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-swift-ipa
          path: ./output/*.ipa
          retention-days: 7
