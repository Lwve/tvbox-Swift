name: Build tvbox-Swift iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Xcode & iOS SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iOS

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ github.sha }}

      - name: Xcode Clean
        run: |
          xcodebuild clean -project tvbox.xcodeproj -scheme tvbox \
            -destination generic/platform=iOS

      - name: Archive
        run: |
          xcodebuild archive -project tvbox.xcodeproj -scheme tvbox \
            -destination generic/platform=iOS \
            -archivePath tvboxSwift.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER=com.test.tvboxswift \
            SKIP_INSTALL=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Generate exportOptions.plist (Unsigned)
        run: |
          cat > exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>thinning</key>
              <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA (Unsigned)
        run: |
          xcodebuild -exportArchive \
            -archivePath tvboxSwift.xcarchive \
            -exportPath ./output \
            -exportOptionsPlist exportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-swift-ipa
          path: ./output/*.ipa
          retention-days: 7
