name: macOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Xcode
      run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
    
    - name: Build macOS
      run: |
        chmod +x package_mac.sh
        ./package_mac.sh
    
    - name: Upload DMG
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: TVBox-macOS.dmg
        path: TVBox-macOS.dmg
